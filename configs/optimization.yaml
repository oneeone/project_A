task: capacitated_maximum_coverage_facility_location

baseline:
  max_sites: 8
  max_travel_time_min: 30
  default_capacity: 1000
  flood_safe_threshold: 0.20
  uncertainty_quantile: 0.75
  time_penalty_weight: 0.05
  random_baseline_repeats: 100
  random_seed: 2026

candidate_types:
  - school
  - hospital
  - stadium
  - shelter
  - public_facility

constraints:
  require_road_connection: true
  exclude_high_confidence_flood: true
  exclude_high_uncertainty: true

comparisons:
  - random_selection
  - population_priority
  - risk_priority
  - optimized_selection

scenarios:
  - optimistic
  - neutral
  - pessimistic

sensitivity:
  max_sites: [5, 8, 10]
  max_travel_time_min: [20, 30, 40]
  default_capacity: [500, 1000, 1500]
